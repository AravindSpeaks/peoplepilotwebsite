name: Deploy to GitHub Pages

permissions:
  contents: write

on:
  push:
    branches: [ main ]

jobs:
  accessibility-check:
    name: Accessibility check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Generate favicons
        run: npm run generate:favicons
      - name: Build site
        run: npm run build
      - name: Serve site (background)
        run: npx http-server ./dist -p 8080 &
      - name: Wait for server
        run: npx wait-on http://127.0.0.1:8080
      - name: Run pa11y accessibility tests
        run: npx pa11y http://127.0.0.1:8080 --config ./pa11y.json

  build-and-deploy:
    needs: accessibility-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Generate favicons
        run: npm run generate:favicons
      - name: Build
        run: npm run build
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false
